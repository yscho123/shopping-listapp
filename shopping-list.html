<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      color: #1a1a2e;
    }

    .input-row input:focus { border-color: #6c63ff; }

    .input-row button {
      padding: 12px 18px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
    }

    .input-row button:hover { background: #574fd6; }
    .input-row button:active { transform: scale(0.95); }

    .stats {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      transition: opacity 0.2s, background 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    li.checked {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    li.checked .item-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: background 0.2s, border-color 0.2s;
    }

    li.checked .check-btn {
      background: #22c55e;
      border-color: #22c55e;
      color: #fff;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #1a1a2e;
      word-break: break-all;
    }

    .del-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    .del-btn:hover { color: #ef4444; background: #fee2e2; }

    .empty {
      text-align: center;
      color: #cbd5e1;
      padding: 32px 0;
      font-size: 0.95rem;
    }

    .clear-btn {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: none;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .clear-btn:hover { border-color: #ef4444; color: #ef4444; background: #fff5f5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 쇼핑 리스트</h1>

    <div class="input-row">
      <input id="itemInput" type="text" placeholder="아이템을 입력하세요" maxlength="80">
      <button id="addBtn" title="추가">＋</button>
    </div>

    <div class="stats" id="stats"></div>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">아직 아이템이 없어요.</div>

    <button class="clear-btn" id="clearBtn">완료된 항목 모두 삭제</button>
  </div>

  <script>
    const input   = document.getElementById('itemInput');
    const addBtn  = document.getElementById('addBtn');
    const listEl  = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const statsEl = document.getElementById('stats');
    const clearBtn = document.getElementById('clearBtn');

    let items = JSON.parse(localStorage.getItem('shopping') || '[]');

    function save() {
      localStorage.setItem('shopping', JSON.stringify(items));
    }

    function render() {
      listEl.innerHTML = '';

      if (items.length === 0) {
        emptyEl.style.display = 'block';
        statsEl.textContent = '';
      } else {
        emptyEl.style.display = 'none';
        const done = items.filter(i => i.checked).length;
        statsEl.textContent = `${done} / ${items.length} 완료`;

        items.forEach((item, idx) => {
          const li = document.createElement('li');
          if (item.checked) li.classList.add('checked');

          const checkBtn = document.createElement('button');
          checkBtn.className = 'check-btn';
          checkBtn.title = item.checked ? '완료 취소' : '완료';
          checkBtn.textContent = item.checked ? '✓' : '';
          checkBtn.addEventListener('click', () => toggle(idx));

          const span = document.createElement('span');
          span.className = 'item-text';
          span.textContent = item.text;

          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.title = '삭제';
          delBtn.textContent = '✕';
          delBtn.addEventListener('click', () => remove(idx));

          li.append(checkBtn, span, delBtn);
          listEl.appendChild(li);
        });
      }
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) return;
      items.unshift({ text, checked: false });
      input.value = '';
      save();
      render();
      input.focus();
    }

    function toggle(idx) {
      items[idx].checked = !items[idx].checked;
      save();
      render();
    }

    function remove(idx) {
      items.splice(idx, 1);
      save();
      render();
    }

    addBtn.addEventListener('click', addItem);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    clearBtn.addEventListener('click', () => {
      items = items.filter(i => !i.checked);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
